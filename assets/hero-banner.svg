<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" role="img" aria-label="Silas Angera — Founder & Principal Engineer at AngiSoft Technologies">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%" fx="15%" fy="30%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="70%" r="45%" fx="85%" fy="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07111f" stop-opacity="0"/>
      <stop offset="10%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="90%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .name { font-family: system-ui, sans-serif; font-weight: 700; font-size: 42px; fill: #f8fafc; letter-spacing: -0.02em; }
      .role { font-family: system-ui, sans-serif; font-weight: 500; font-size: 18px; fill: #22d3ee; letter-spacing: 0.08em; text-transform: uppercase; }
      .company { font-family: system-ui, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
      .tagline { font-family: system-ui, sans-serif; font-weight: 400; font-size: 15px; fill: #64748b; line-height: 1.6; }
      .stat-value { font-family: system-ui, sans-serif; font-weight: 700; font-size: 26px; fill: #f8fafc; }
      .stat-label { font-family: system-ui, sans-serif; font-weight: 400; font-size: 11px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
      .tech-pill { font-family: system-ui, sans-serif; font-weight: 500; font-size: 12px; fill: #22d3ee; }
    ]]></style>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="420" fill="url(#bgGradient)"/>
  
  <!-- Atmospheric glows -->
  <ellipse cx="216" cy="126" rx="400" ry="200" fill="url(#glowLeft)"/>
  <ellipse cx="1224" cy="294" rx="360" ry="180" fill="url(#glowRight)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1440" y2="0" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Main content -->
  <g transform="translate(100, 80)">
    <!-- AngiSoft Logo Mark -->
    <g>
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#0b1a2f" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="28" cy="28" r="20" fill="#22d3ee"/>
      <circle cx="28" cy="28" r="14" fill="#0e7490"/>
      <circle cx="28" cy="28" r="6" fill="#38bdf8"/>
    </g>

    <!-- Name -->
    <text x="72" y="42" class="name">Silas Angera</text>
    
    <!-- Role + Company -->
    <text x="72" y="74" class="role">Founder & Principal Engineer</text>
    <text x="72" y="96" class="company">AngiSoft Technologies · Nairobi, Kenya</text>

    <!-- Tagline -->
    <text x="72" y="138" class="tagline" style="max-width: 600px;">
      Building production-grade platforms: multi-tenant ERPs, AI-powered career intelligence, 
      offline-first mobile apps, and scalable backend architectures.
    </text>

    <!-- Technology pillars -->
    <g transform="translate(72, 190)">
      <text class="tech-pill">Spring Boot  ·  Java</text>
      <text x="145" class="tech-pill">Flutter  ·  Dart</text>
      <text x="285" class="tech-pill">React  ·  Next.js  ·  TypeScript</text>
      <text x="485" class="tech-pill">PostgreSQL  ·  Redis</text>
      <text x="640" class="tech-pill">Docker  ·  Kubernetes</text>
    </g>

    <!-- GitHub Stats Card -->
    <g transform="translate(840, 20)">
      <rect x="0" y="0" width="520" height="240" rx="16" fill="#0b1a2f" stroke="#1e3a5f" stroke-width="1" opacity="0.9"/>
      
      <text x="260" y="44" class="role" text-anchor="middle" style="font-size: 14px; fill: #22d3ee;">GitHub Pulse</text>
      
      <g transform="translate(30, 70)">
        <g transform="translate(0, 0)">
          <text class="stat-value" text-anchor="middle" x="55">53</text>
          <text class="stat-label" text-anchor="middle" x="55" y="26">Repositories</text>
        </g>
        <g transform="translate(130, 0)">
          <text class="stat-value" text-anchor="middle" x="55">1,282</text>
          <text class="stat-label" text-anchor="middle" x="55" y="26">Contributions</text>
        </g>
        <g transform="translate(260, 0)">
          <text class="stat-value" text-anchor="middle" x="55">29</text>
          <text class="stat-label" text-anchor="middle" x="55" y="26">Stars</text>
        </g>
        <g transform="translate(390, 0)">
          <text class="stat-value" text-anchor="middle" x="55">23</text>
          <text class="stat-label" text-anchor="middle" x="55" y="26">Followers</text>
        </g>
      </g>

      <g transform="translate(30, 180)">
        <rect x="0" y="0" width="230" height="36" rx="18" fill="#0e7490" opacity="0.2" stroke="#0e7490" stroke-width="1"/>
        <text x="115" y="22" class="tech-pill" text-anchor="middle" style="font-size: 12px;">AngiSoft Technologies</text>
        
        <rect x="250" y="0" width="230" height="36" rx="18" fill="#0e7490" opacity="0.2" stroke="#0e7490" stroke-width="1"/>
        <text x="365" y="22" class="tech-pill" text-anchor="middle" style="font-size: 12px;">Open to Collaboration</text>
      </g>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="0" y1="420" x2="1440" y2="420" stroke="url(#accentLine)" stroke-width="1" opacity="0.4"/>
</svg>