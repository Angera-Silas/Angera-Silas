<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" role="img" aria-label="Silas Angera — Founder & Principal Engineer at AngiSoft Technologies">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="40%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    
    <radialGradient id="glowLeft" cx="15%" cy="35%" r="55%" fx="15%" fy="35%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glowRight" cx="85%" cy="65%" r="50%" fx="85%" fy="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="35%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07111f" stop-opacity="0"/>
      <stop offset="10%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="90%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </linearGradient>

    <style><![CDATA[
      .name { font-family: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif; font-weight: 700; font-size: 44px; fill: #f8fafc; letter-spacing: -0.025em; }
      .role { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 19px; fill: #22d3ee; letter-spacing: 0.08em; text-transform: uppercase; }
      .company { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; }
      .tagline { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 400; font-size: 16px; fill: #64748b; line-height: 1.6; }
      .stat-value { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 28px; fill: #f8fafc; }
      .stat-label { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
      .tech-pill { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 500; font-size: 12px; fill: #22d3ee; }
    ]]></style>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="420" fill="url(#bgGradient)"/>
  
  <!-- Atmospheric glows -->
  <ellipse cx="216" cy="147" rx="380" ry="180" fill="url(#glowLeft)"/>
  <ellipse cx="1224" cy="273" rx="340" ry="170" fill="url(#glowRight)"/>
  <ellipse cx="720" cy="210" rx="280" ry="140" fill="url(#glowCenter)"/>
  
  <!-- Subtle grid overlay -->
  <rect width="1440" height="420" fill="url(#gridPattern)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1440" y2="0" stroke="url(#accentLine)" stroke-width="1.5"/>

  <!-- Main content area -->
  <g transform="translate(100, 70)">
    <!-- Left column: Identity -->
    <g>
      <!-- AngiSoft Logo Mark -->
      <svg width="56" height="56" viewBox="0 0 56 56" style="overflow: visible;">
        <defs>
          <clipPath id="logoClip">
            <rect x="0" y="0" width="56" height="56" rx="12"/>
          </clipPath>
        </defs>
        <rect width="56" height="56" rx="12" fill="#0b1a2f" stroke="#1e3a5f" stroke-width="1"/>
        <image href="data:image/svg+xml;base64," x="0" y="0" width="56" height="56" clip-path="url(#logoClip)"/>
      </svg>

      <!-- Name -->
      <text x="0" y="96" class="name">Silas Angera</text>
      
      <!-- Role + Company -->
      <g transform="translate(0, 124)">
        <text class="role">Founder & Principal Engineer</text>
        <text x="0" y="32" class="company">AngiSoft Technologies · Nairobi, Kenya</text>
      </g>

      <!-- Tagline -->
      <text x="0" y="196" class="tagline" style="max-width: 520px;">
        Building production-grade platforms: multi-tenant ERPs, AI-powered career intelligence, 
        offline-first mobile apps, and scalable backend architectures.
      </text>

      <!-- Technology pillars (inline, not list) -->
      <g transform="translate(0, 250)">
        <text class="tech-pill">Spring Boot  ·  Java</text>
        <text x="145" class="tech-pill">Flutter  ·  Dart</text>
        <text x="285" class="tech-pill">React  ·  Next.js  ·  TypeScript</text>
        <text x="485" class="tech-pill">PostgreSQL  ·  Redis</text>
        <text x="640" class="tech-pill">Docker  ·  Kubernetes</text>
      </g>
    </g>

    <!-- Right column: GitHub pulse (visual, not list) -->
    <g transform="translate(840, 20)">
      <!-- Subtle card background -->
      <rect x="0" y="0" width="520" height="340" rx="16" fill="#0b1a2f" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
      
      <!-- Header -->
      <text x="260" y="48" class="role" text-anchor="middle" style="font-size: 15px; fill: #22d3ee;">GitHub Activity</text>
      
      <!-- Activity graph placeholder (will be replaced with actual image) -->
      <rect x="30" y="64" width="460" height="140" rx="8" fill="#07111f" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="260" y="140" class="stat-label" text-anchor="middle" style="fill: #475569;">Contribution graph loads here</text>
      
      <!-- Stats row -->
      <g transform="translate(30, 230)">
        <g transform="translate(0, 0)">
          <text class="stat-value" text-anchor="middle" x="55">53</text>
          <text class="stat-label" text-anchor="middle" x="55" y="28">Repositories</text>
        </g>
        <g transform="translate(130, 0)">
          <text class="stat-value" text-anchor="middle" x="55">1,282</text>
          <text class="stat-label" text-anchor="middle" x="55" y="28">Contributions</text>
        </g>
        <g transform="translate(260, 0)">
          <text class="stat-value" text-anchor="middle" x="55">29</text>
          <text class="stat-label" text-anchor="middle" x="55" y="28">Stars</text>
        </g>
        <g transform="translate(390, 0)">
          <text class="stat-value" text-anchor="middle" x="55">23</text>
          <text class="stat-label" text-anchor="middle" x="55" y="28">Followers</text>
        </g>
      </g>

      <!-- Organization badge -->
      <g transform="translate(30, 295)">
        <rect x="0" y="0" width="230" height="36" rx="18" fill="#0e7490" opacity="0.2" stroke="#0e7490" stroke-width="1"/>
        <text x="115" y="23" class="tech-pill" text-anchor="middle" style="font-size: 13px;">AngiSoft Technologies</text>
        
        <rect x="250" y="0" width="230" height="36" rx="18" fill="#0e7490" opacity="0.2" stroke="#0e7490" stroke-width="1"/>
        <text x="365" y="23" class="tech-pill" text-anchor="middle" style="font-size: 13px;">Open to Collaboration</text>
      </g>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="0" y1="420" x2="1440" y2="420" stroke="url(#accentLine)" stroke-width="1" opacity="0.4"/>
</svg>