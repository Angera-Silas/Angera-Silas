<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" role="img" aria-label="Silas Angera -- Founder &amp; Principal Engineer at AngiSoft Technologies">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%" fx="15%" fy="30%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="70%" r="45%" fx="85%" fy="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07111f" stop-opacity="0"/>
      <stop offset="10%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="90%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .name { font-family: system-ui, sans-serif; font-weight: 700; font-size: 56px; fill: #f8fafc; letter-spacing: -0.02em; }
      .role { font-family: system-ui, sans-serif; font-weight: 500; font-size: 24px; fill: #22d3ee; letter-spacing: 0.08em; text-transform: uppercase; }
      .company { font-family: system-ui, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
      .tagline { font-family: system-ui, sans-serif; font-weight: 400; font-size: 15px; fill: #64748b; line-height: 1.6; }
      .tech-pill { font-family: system-ui, sans-serif; font-weight: 500; font-size: 12px; fill: #22d3ee; }
    ]]></style>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="420" fill="url(#bgGradient)"/>
  
  <!-- Atmospheric glows -->
  <ellipse cx="216" cy="126" rx="400" ry="200" fill="url(#glowLeft)"/>
  <ellipse cx="1224" cy="294" rx="360" ry="180" fill="url(#glowRight)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1440" y2="0" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Main content -->
  <g transform="translate(100, 80)">
    <!-- Name -->
    <text x="0" y="42" class="name">Silas Angera</text>
    
    <!-- Role + Company -->
    <text x="0" y="74" class="role">Founder &amp; Principal Engineer</text>
    <text x="0" y="96" class="company">AngiSoft Technologies &#8226; Nairobi, Kenya</text>

    <!-- Tagline -->
    <text x="0" y="138" class="tagline" style="max-width: 600px;">
      Building production-grade platforms: multi-tenant ERPs, AI-powered career intelligence, 
      offline-first mobile apps, and scalable backend architectures.
    </text>

    <!-- Technology pillars -->
    <g transform="translate(0, 190)">
      <text class="tech-pill">Spring Boot  &#8226;  Java</text>
      <text x="145" class="tech-pill">Flutter  &#8226;  Dart</text>
      <text x="285" class="tech-pill">React  &#8226;  Next.js  &#8226;  TypeScript</text>
      <text x="485" class="tech-pill">PostgreSQL  &#8226;  Redis</text>
      <text x="640" class="tech-pill">Docker  &#8226;  Kubernetes</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="0" y1="420" x2="1440" y2="420" stroke="url(#accentLine)" stroke-width="1" opacity="0.4"/>
</svg>